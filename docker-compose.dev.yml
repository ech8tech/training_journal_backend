version: "3.8"

networks:
  app_net:
    external: true

services:
  backend:
    build:
      context: .
      target: development
    container_name: backend
    env_file: .env.development
    ports: ["3001:3001"]
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_net]
    command: ["npm","run","start:dev"]

  postgres:
    image: postgres:17
    container_name: postgres
    env_file: .env.development
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: training_journal
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: secret@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Если позже захочешь открыть pgAdmin под префиксом /pgadmin за внешним прокси — раскомментируй два файла ниже:
      # - ./pgadmin/config_local.py:/pgadmin4/config_local.py:ro
    expose:
      - "80"  # наружу не публикуем, чтобы случайно не светить
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks: [app_net]
    restart: unless-stopped

volumes:
  pgdata: {}
  db_data: {}
  pgadmin_data: {}
