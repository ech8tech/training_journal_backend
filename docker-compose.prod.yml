version: "3.8"

networks:
  app_net:
    external: true

services:
  backend:
    build:
      context: .
      target: production
    container_name: backend
    env_file: .env
    expose: ["9001"]
#    ports: ["9001:9001"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_net]
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: postgres
    env_file: .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

volumes:
  pgdata: {}
